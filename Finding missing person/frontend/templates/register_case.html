
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Case</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <strong>Missing Person AI</strong>
    <div>
        <a href="/">Login</a>
        <a href="/search">Search</a>
        <a href="/review-matches">Review</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h1>Register Missing Person</h1>
        <p>Enter the missing person's information below.</p>

        <form id="caseForm">
            <label>Case Number</label>
            <input type="text" id="caseNumber"
                   placeholder="MP-2026-0001" required>

            <label>Person Name</label>
            <input type="text" id="personName" required>

            <label>Age</label>
            <input type="number" id="age" min="0" max="120">

            <label>Gender</label>
            <select id="gender">
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
                <option>Unknown</option>
            </select>

            <label>Description</label>
            <textarea id="description"
                      placeholder="Enter identifying details"></textarea>

            <label>Last Seen Location</label>
            <input type="text" id="location">

            <label>Last Seen Date and Time</label>
            <input type="datetime-local" id="lastSeen">

            <label>Upload Person's Photo</label>
            <input type="file" id="personPhoto"
                   accept="image/jpeg,image/png,image/webp" required>

            <p class="small">
                Upload only an image you are authorized to submit.
            </p>

            <button type="submit" id="caseButton">
                Submit Case
            </button>
        </form>

        <div id="caseMessage" class="message"></div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
